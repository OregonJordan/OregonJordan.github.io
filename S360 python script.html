const scriptSource = String.raw`import os
import pandas as pd
import time
import warnings
import openpyxl
warnings.simplefilter(action='ignore', category=FutureWarning)


# Use the "client_list" XLSX file to identify which clients to update
# Process creates a folder if one does not exist, otherwise uses the existing folder to overwrite the old data

# Set this to False if you want to skip this process
run_full_process = True

# Set this to False if you want to skip this process
# Process creates new IAN Segmentation file for new clients - create folder and add to client_list.xlsx first
run_ian_segmentation = False


print("Process started")
start_time_entire_process = time.time()
start_time_data_splitting_process = time.time()

# Step 2: Setup the paths and load the Clients data frame
input_path = r"...\Shopper360 Testing Folder\_MASTER IANs\IAN factsData"
output_path = r"...\Shopper360 Testing Folder\IAN Data"
master_data_path = r"P...\Shopper360 Testing Folder\_MASTER IANs"
client_file_path = r"...\Shopper360 Testing Folder\PBI Files\client_list.xlsx"
mexdata_path = r"...\Shopper360 Testing Folder\MexData"


clients_df = pd.read_excel(client_file_path, sheet_name=0, usecols="A")
clients_df['Clients'] = clients_df['Clients'].str.strip().str.upper()

    
if run_full_process:
    # Create/clear client folders in the output path
    # Only clears folders of clients that are listed in the client_list.xlsx
    for client in clients_df['Clients']:
        client_folder = os.path.join(output_path, client)
        if os.path.exists(client_folder):
            # Loop through all files in the client folder
            for filename in os.listdir(client_folder):
                file_path = os.path.join(client_folder, filename)
                
                # Check if the filename contains "IAN Client PRG"
                if "IAN Client PGR TEST" in filename:   #----JH Edit
                    if os.path.isfile(file_path):
                        os.remove(file_path)
        
        # Ensure the client folder exists (create it if it doesn't)
        os.makedirs(client_folder, exist_ok=True)

    print("Client folders cleared and created")
    print("Loading the IAN Master PGR file...")


if run_full_process:
    try:
        # Step 3: Load and process the IAN MASTER PGR file
        ian_master_pgr_path = os.path.join(master_data_path, "IAN MASTER PGR.xlsx")    #----JH Edit
        ian_master_pgr_df = pd.read_excel(ian_master_pgr_path, skiprows=20, engine='openpyxl')  #----JH Edit
        print("--- ian_master_pgr file loaded")

        # Clean and prepare the data
        ian_master_pgr_df['Category'] = ian_master_pgr_df['Category'].str.strip()
        ian_master_pgr_df['Class'] = ian_master_pgr_df['Class'].str.strip()
        ian_master_pgr_df['category_class_id'] = ian_master_pgr_df['Category'] + ian_master_pgr_df['Class']
        ian_master_pgr_df['Client'] = ""
        ian_master_pgr_df = ian_master_pgr_df.drop_duplicates(subset=['UPC ID'], keep='first')

        # Convert all columns to string except 'First Shop Date' and 'Sales in Promo Week'       
        ian_master_pgr_df = ian_master_pgr_df.apply(lambda col: col.map(lambda x: str(x) if not pd.api.types.is_datetime64_any_dtype(col) else x))

        print("--- ian_master_pgr file cleaned")

        # Step 4: Load and process the IAN Brand Category Lookup file
        ian_brand_category_lookup_path = os.path.join(master_data_path, "IAN Brand Category Lookup.xlsx")
        ian_brand_category_lookup_df = pd.read_excel(ian_brand_category_lookup_path)
        print("--- ian_brand_category_lookup file loaded")

        # Clean and prepare the data
        for col in ['CATEGORY', 'CLASS', 'CLIENT']:
            ian_brand_category_lookup_df[col] = ian_brand_category_lookup_df[col].str.strip()

        ian_brand_category_lookup_df['category_class_id'] = ian_brand_category_lookup_df['CATEGORY'] + ian_brand_category_lookup_df['CLASS']
        print("--- ian_brand_category_lookup file cleaned")

        # Step 5: Fill in the Client column in ian_master_pgr_df using lookup table
        # Merge the DataFrames using category_class_id as the key
        ian_master_pgr_df = pd.merge(ian_master_pgr_df, ian_brand_category_lookup_df[['category_class_id', 'CLIENT']],
                                    on='category_class_id', how='left')
        print("--- ian_master_pgr file and ian_brand_category_lookup file merged")

        # Fill the 'Client' column with the values from the 'CLIENT' column
        ian_master_pgr_df['Client'] = ian_master_pgr_df['CLIENT']

        # Drop the 'CLIENT' column from the merged DataFrame
        ian_master_pgr_df.drop(columns=['CLIENT'], inplace=True)
    except Exception as e:
        raise e


if run_full_process:
    try:
        # Step 6: Create XLSX files for each client
        for client in clients_df['Clients']:
            client_df = ian_master_pgr_df[ian_master_pgr_df['Client'] == client]
            if client_df.empty:
                continue
            client_file_path = os.path.join(output_path, client, "IAN Client PGR.xlsx")
            client_df.to_excel(client_file_path, index=False)
            print(f"Processed IAN PGR file: {client}")

        print(f"All IAN client PGR files processed")
    except Exception as e:
        raise e

if run_full_process:
    try:
        for client in clients_df['Clients']:
            client_folder = os.path.join(output_path, client)
            if os.path.exists(client_folder):
                # Loop through all files in the client folder
                for filename in os.listdir(client_folder):
                    file_path = os.path.join(client_folder, filename)
                    
                    # Check if the filename contains "IAN Fact Data"
                    if "IAN Fact Data" in filename:
                        if os.path.isfile(file_path):
                            os.remove(file_path)
            
            # Ensure the client folder exists (create it if it doesn't)
            os.makedirs(client_folder, exist_ok=True)

        print("Client folders cleared and created")
        print(f"Combining all files in IAN factsData folder... This may take some time...")

        # Step 7: Process each file in the input path
        def load_and_combine_files(input_path):
            # List to store individual DataFrames
            dataframes = []

            # Iterate through each file in the input directory
            for file_name in os.listdir(input_path):
                if file_name.endswith(".xlsx"):
                    # Construct the full file path
                    file_path = os.path.join(input_path, file_name)

                    # Read the Excel file into a DataFrame
                    df = pd.read_excel(file_path, skiprows=20)

                    # Add a column to identify the source file if needed
                    df['source_file'] = os.path.splitext(file_name)[0].replace(" ", "_")

                    # Strip leading and trailing spaces from column headers
                    df.columns = df.columns.str.strip()

                    # Append the DataFrame to the list
                    dataframes.append(df)
                    
                    print(f"--- Loaded file: {file_name}")

            # Combine all DataFrames in the list
            combined_df = pd.concat(dataframes, ignore_index=True)
            return combined_df

        # Function to load and combine files
        ian_facts_data = load_and_combine_files(input_path)

        print("--- Combined all files in IAN factsData folder")
        
        # Process the combined data
        for col in ['UPC ID', 'UPC Name', 'Std Quantity']:
            ian_facts_data[col] = ian_facts_data[col].astype(str)

        print("--- Cleaned the IAN factsData file")

        # Step 8: Fill in the Client column based on the UPC ID
        ian_facts_data = pd.merge(ian_facts_data, ian_master_pgr_df[['UPC ID', 'Client']], on='UPC ID', how='left')

        no_client_matches = ian_facts_data['Client'].isnull().sum()
        if no_client_matches > 0:
            print("--- Added clients to ian_facts_data")
        
        # Save client-specific files
        for client in clients_df['Clients']:
            client_df = ian_facts_data[ian_facts_data['Client'] == client]
            if client_df.empty:
                continue

            # Extract the date from the first file in the input path
            first_file_name = os.listdir(input_path)[0]
            date_part = first_file_name.split()[0]

            # Generate the file name with the correct date
            client_file_name = f"{date_part} IAN Fact Data.xlsx"
            client_file_path = os.path.join(output_path, client, client_file_name)
            client_df.to_excel(client_file_path, index=False)

            # Print the client being processed
            print(f"Processed IAN fact data file: {client}")

        print(f"All IAN fact data files processed")
    except Exception as e:
        raise e


### Create IAN Segmentation file for new Clients
if run_ian_segmentation:
    print("Checking for IAN Segmentation files for new clients")

    for client in clients_df['Clients']:
        client_folder = os.path.join(mexdata_path, client)
        custom_file_path = os.path.join(client_folder, "Custom IAN Segmentation.xlsx")

        # Create file only if it does not exist
        if not os.path.exists(custom_file_path):
            df = pd.DataFrame(columns=["UPC ID", "Category"])
            df.to_excel(custom_file_path, index=False)
            print(f"Created Custom IAN Segmentation file for client: {client}")
        else:
            continue

# Entire process script time
end_time_entire_process = time.time()
processing_time_entire_process = end_time_entire_process - start_time_entire_process

# Convert the time to a more readable format (e.g., seconds, minutes)
minutes, seconds = divmod(processing_time_entire_process, 60)
print(f"Total script processing time: {int(minutes)} minutes and {seconds:.2f} seconds")`;
